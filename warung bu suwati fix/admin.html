<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; frame-src https://*.google.com https://*.google.co.id; connect-src https://*.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2f7f73">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f7f73'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23fef3c7' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E">
<title>Pengelola Produk - Toko Bu Suwati</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="admin">
<div class="awning" aria-hidden="true"></div>
<header class="topbar">
  <a class="brand" href="index.html">Toko Bu Suwati</a>
  <nav><a href="index.html">Lihat toko</a></nav>
  <button type="button" class="link" id="logoutBtn" hidden>Keluar</button>
</header>
<main class="section admin-wrap">
  <h1>Kelola produk</h1>
  <div id="loginCard">
  <form id="loginForm" class="order card">
    <h2>Masuk sebagai pengelola</h2>
    <label for="lEmail">Email</label>
    <input id="lEmail" type="email" required autocomplete="username">
    <label for="lPass">Kata sandi</label>
    <input id="lPass" type="password" required autocomplete="current-password">
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button class="btn" type="submit">Masuk</button>
  </form>
  </div>
  <div id="adminPanel" class="admin-wrap" hidden>
  <p class="lead">Data tersimpan di database Supabase dan langsung muncul di halaman toko untuk semua pengunjung.</p>
  <form id="addForm" class="order card">
    <h2 id="formTitle">Tambah produk baru</h2>
    <label for="pNama">Nama produk</label>
    <input id="pNama" required maxlength="60" placeholder="Contoh: Gula Pasir">
    <label for="pHarga">Harga (Rp)</label>
    <input id="pHarga" type="number" min="100" max="10000000" step="100" required placeholder="16000">
    <label for="pKategori">Kategori</label>
    <select id="pKategori" required></select>
    <label for="pStok">Stok</label>
    <input id="pStok" type="number" min="0" max="9999" step="1" required value="10">
    <label for="pSatuan">Dijual per</label>
    <select id="pSatuan">
      <option value="pcs">Satuan (pcs)</option>
      <option value="kg">Kiloan (1 kg, 1/2 kg, 1/4 kg)</option>
    </select>
    <label for="produk-gambar">Foto Produk (opsional)</label>
    <input type="file" id="produk-gambar" accept="image/*">
    <small>Format JPG/PNG, ukuran 500 KB – 2 MB. Kosongkan untuk pakai inisial nama.</small>
    <p class="err" id="gambar-error" role="alert" hidden></p>
    <p class="hint" id="gambarSaatIni" hidden>Gambar saat ini</p>
    <img id="preview-gambar" class="preview" alt="Pratinjau" hidden>
    <button class="btn" id="submitBtn" type="submit">Simpan produk</button>
    <button class="link" type="button" id="cancelEdit" hidden>Batal Edit</button>
  </form>
  <section class="card">
    <div class="list-head">
      <h2>Daftar produk <span class="badge" id="adminCount">0</span></h2>
      <div class="admin-tools">
        <button type="button" class="btn" id="exportCsv">Export ke Excel (CSV)</button>
        <label class="btn btn-secondary" for="importCsv">Import dari Excel (CSV)</label>
        <input type="file" id="importCsv" accept=".csv,text/csv" hidden>
        <button type="button" class="btn-ghost" id="downloadTemplate">Unduh Template CSV</button>
      </div>
    </div>
    <ul class="admin-list" id="adminList"></ul>
  </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
